# Codemagic free-tier build config (alternative to GitHub Actions)
# Free tier: 500 build minutes / month, no credit card, cloud Mac + Linux runners.
#
# HOW TO USE  ── IMPORTANT: this file is only used if you SELECT this workflow.
# 1.  Sign in at https://codemagic.io with GitHub / GitLab / Bitbucket.
# 2.  Add the SwiftSnap repo (github.com/tinaarvesen46-ux/android).
# 3.  In the app, click "Start new build" and in the workflow dropdown pick
#     "SwiftSnap Android Debug (APK + AAB)"  ── do NOT pick "Default Workflow".
#     ("Default Workflow" is Codemagic's UI editor and only produces the .aab.)
# 4.  When the build finishes, both app-debug.apk and app-debug.aab appear
#     under Artifacts.

workflows:
  android-debug:
    name: SwiftSnap Android Debug (APK + AAB)
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fetch dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build debug APK
        script: flutter build apk --debug
      - name: Build debug App Bundle
        script: flutter build appbundle --debug
      - name: List build outputs
        script: |
          echo "=== flutter-apk ==="
          ls -lh build/app/outputs/flutter-apk/ || true
          echo "=== bundle/debug ==="
          ls -lh build/app/outputs/bundle/debug/ || true
    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk
      - build/app/outputs/bundle/**/*.aab
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - your-email@example.com   # ← replace with your email
        notify:
          success: true
          failure: true
