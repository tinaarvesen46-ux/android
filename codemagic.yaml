# SwiftSnap Android build configuration
# Builds BOTH an installable APK and an Android App Bundle.

workflows:
  android-debug:
    name: SwiftSnap Android Debug APK + AAB
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Fetch dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Analyze
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build debug APK
        script: |
          flutter build apk --debug

      - name: Build debug AAB
        script: |
          flutter build appbundle --debug

      - name: Verify Android artifacts
        script: |
          echo "=== APK ==="
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

          echo "=== AAB ==="
          ls -lh build/app/outputs/bundle/debug/app-debug.aab

          test -s build/app/outputs/flutter-apk/app-debug.apk
          test -s build/app/outputs/bundle/debug/app-debug.aab

          echo "Both Android artifacts exist and are non-zero."

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/bundle/debug/app-debug.aab
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - ghostsecteamllc@gmail.com
        notify:
          success: true
          failure: true