name: darvin_app
description: SwiftSnap Flutter app
publish_to: none
version: 2.8.0+15
environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0
  http: ^1.2.2
  path_provider: ^2.1.5
  provider: ^6.1.1
  url_launcher: ^6.3.2
  share_plus: ^11.0.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4
  # ── Realtime (self-hosted Laravel Reverb via Pusher protocol, pure Dart) ──
  web_socket_channel: ^3.0.3
  google_fonts: ^8.2.1
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.71.0
  vector_math: ^2.1.4
  archive: ^4.0.7
  # ── SwiftSnap camera stack ──
  # Real device camera capture (photo + video)
  camera: ^0.11.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  # Media editor / beauty engine (CPU-side, no license required)
  image: ^4.3.0
  # Face landmarks (free, on-device; used by beauty engine to target skin region)
  google_mlkit_face_detection: ^0.13.0
  # Native permission handling for camera / mic / location / photos
  permission_handler: ^12.0.1
  # ── SwiftMap ──
  # Free map using OpenStreetMap tiles (no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  # ── Notifications ──
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # ── World AR (ARCore + ARKit) ──
  # Cross-platform AR runtime powering World lens templates (planes, anchors,
  # 3D nodes).  Uses the actively-maintained `ar_flutter_plugin_plus` fork
  # (Nov 2025) since the original `ar_flutter_plugin_updated` name has been
  # yanked from pub.dev.  API is otherwise identical.
  ar_flutter_plugin_plus: ^1.1.3
  # ── Voice / Video calling (self-hosted WebRTC over Reverb + coturn) ──
  flutter_webrtc: ^1.6.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
