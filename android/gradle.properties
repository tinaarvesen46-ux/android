org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
# Pin to AGP 8.11's classic DSL — matches `com.android.application 8.11.1` in
# settings.gradle.kts.  Flutter's `disable_new_dsl_migration` would append
# this on first build anyway; declaring it here makes the source self-
# sufficient so a clean Codemagic checkout doesn't rely on the auto-migration.
# (AGP 8.11.x still fully supports the classic DSL; only AGP 9.x enforces the
# new DSL.  We stay on 8.11.x because that is the current Flutter *minimum* —
# see https://docs.flutter.dev/release/breaking-changes/android-gradle-plugin-8-11.)
android.newDsl=false
# Same reasoning for Kotlin — we ship `org.jetbrains.kotlin.android 2.2.20`
# (Flutter's current minimum, per its `KGP_MIN_VERSION` check).  Staying on
# the classic Kotlin Gradle plugin path avoids the KGP 2.3 new-DSL migration.
android.builtInKotlin=false
