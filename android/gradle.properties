org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Pin to AGP 8.9's classic DSL — matches `com.android.application 8.9.0` in
# settings.gradle.kts.  Flutter's `disable_new_dsl_migration` would append
# this on first build anyway; declaring it here makes the source self-
# sufficient so a clean Codemagic checkout doesn't rely on the auto-migration.
android.newDsl=false
# Same reasoning for Kotlin — we ship `org.jetbrains.kotlin.android 2.1.0`
# so we stay on the classic Kotlin Gradle plugin path.
android.builtInKotlin=false
