name: Build Android APK (free, cloud)

# ─────────────────────────────────────────────────────────────────────────
# Free Android APK builder — runs on GitHub's free Ubuntu runners.
# Public repos: unlimited free minutes.  Private repos: 2000 min/month free.
# No local Android Studio, no local Java, no local Flutter needed.
#
# HOW TO USE
# 1.  Push this Flutter project to a repo on GitHub (public or private).
# 2.  Go to the repo → Actions tab → allow workflows.
# 3.  Push a commit OR click "Run workflow" on the "Build Android APK" job.
# 4.  When the build finishes (~6 min), download `app-debug.apk` from the
#     workflow's Artifacts section.
# 5.  Copy the APK to your Android phone and install it (settings →
#     "install from unknown sources").
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Fetch dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSnap-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build release APK (unsigned)
        run: flutter build apk --release
        continue-on-error: true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SwiftSnap-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
